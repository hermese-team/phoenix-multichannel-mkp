services:
  # สร้าง Shopee-specific Kafka topics บน Kafka ที่รันอยู่แล้ว
  kafka-init-shopee:
    image: apache/kafka:latest
    command: >
      bash -c "
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic shopee.order.webhook   --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic shopee.product.sync    --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic shopee.product.publish --partitions 3 --replication-factor 1 &&
        echo 'Shopee topics created.'
      "
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5

  shopee-server:
    build:
      context: .
      dockerfile: sellchannel/shopee/cmd/server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      APP_PORT: "8080"
      APP_LOG_LEVEL: info
      SHOPEE_PARTNER_ID: "${SHOPEE_PARTNER_ID}"
      SHOPEE_APP_KEY: "${SHOPEE_APP_KEY}"
      SHOPEE_APP_SECRET: "${SHOPEE_APP_SECRET}"
      SHOPEE_BASE_URL: "https://openplatform.sandbox.test-stable.shopee.sg"
      SHOPEE_OAUTH_REDIRECT_URL: "${SHOPEE_OAUTH_REDIRECT_URL}"
      # ชี้ไปที่ infra ของ phoenix-oms-mkp-service (ใช้ชื่อ service ได้เลยเพราะอยู่ network เดียวกัน)
      POSTGRES_DSN: "postgres://postgres:password@postgres:5432/marketplace?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      KAFKA_BROKER: "kafka:29092"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    depends_on:
      kafka-init-shopee:
        condition: service_completed_successfully
    restart: unless-stopped

  shopee-consumer:
    build:
      context: .
      dockerfile: sellchannel/shopee/cmd/consumer/Dockerfile
    environment:
      APP_ENV: development
      APP_LOG_LEVEL: info
      SHOPEE_PARTNER_ID: "${SHOPEE_PARTNER_ID}"
      SHOPEE_APP_KEY: "${SHOPEE_APP_KEY}"
      SHOPEE_APP_SECRET: "${SHOPEE_APP_SECRET}"
      SHOPEE_BASE_URL: "https://openplatform.sandbox.test-stable.shopee.sg"
      POSTGRES_DSN: "postgres://postgres:password@postgres:5432/marketplace?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      KAFKA_BROKER: "kafka:29092"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    depends_on:
      kafka-init-shopee:
        condition: service_completed_successfully
    restart: unless-stopped

  shopee-scheduler:
    build:
      context: .
      dockerfile: sellchannel/shopee/cmd/scheduler/Dockerfile
    environment:
      APP_ENV: development
      APP_LOG_LEVEL: info
      SHOPEE_PARTNER_ID: "${SHOPEE_PARTNER_ID}"
      SHOPEE_APP_KEY: "${SHOPEE_APP_KEY}"
      SHOPEE_APP_SECRET: "${SHOPEE_APP_SECRET}"
      SHOPEE_BASE_URL: "https://openplatform.sandbox.test-stable.shopee.sg"
      POSTGRES_DSN: "postgres://postgres:password@postgres:5432/marketplace?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    restart: unless-stopped

networks:
  default:
    name: mkp-net
    external: true
