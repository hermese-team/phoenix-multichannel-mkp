networks:
  shopee-dev:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    networks: [shopee-dev]
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:latest
    hostname: kafka
    networks: [shopee-dev]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: apache/kafka:latest
    networks: [shopee-dev]
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - bash
      - -c
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists
        --topic raw.order.accepted.v1
        --partitions 1
        --replication-factor 1
        && echo 'Topics created'
    restart: on-failure

  redis-ui:
    image: redislabs/redisinsight:latest
    networks: [shopee-dev]
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy

  kafka-ui:
    image: redpandadata/console:latest
    networks: [shopee-dev]
    ports:
      - "8081:8080"
    environment:
      CONFIG_FILEPATH: /etc/redpanda/config.yaml
    volumes:
      - ./redpanda-console-config.yaml:/etc/redpanda/config.yaml
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  redis-data:
